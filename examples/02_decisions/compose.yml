name: saf-example-02-decisions

x-database-url: &database-url postgres://saf:saf@postgres:5432/saf

x-tui: &tui
  image: node:24-alpine
  profiles: [cli]
  entrypoint: ["npx", "-y", "-p", "shared-agent-framework@0.3", "http-client-tui"]
  networks: [public]

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?copy .env.example to .env and put your model key in it}
      DATABASE_URL: *database-url
      ALICE_PASSWORD: ${ALICE_PASSWORD:?copy .env.example to .env}
      BOB_PASSWORD: ${BOB_PASSWORD:?copy .env.example to .env}
      SIGNING_KEY_FILE: /app/insecure-example-only-signing-key.pem
      PUBLIC_HOST: 0.0.0.0
      PUBLIC_PORT: "8082"
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: "7411"
      AGENT_SERVER_URL: http://gateway:7411
      AGENT_IMAGE: saf-decisions-agent:0.83.0
      AGENT_NETWORK: saf_decisions_agent
      RUNTIME_DIR_HOST: ${PWD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./insecure-example-only-signing-key.pem:/app/insecure-example-only-signing-key.pem:ro
      - ./state/workspace:/app/state/workspace
      - ./state/agent:/app/state/agent
    ports:
      - "127.0.0.1:8082:8082"
    networks: [db, agent, public]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      agent-image:
        condition: service_completed_successfully
    stop_grace_period: 300s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "drizzle-kit", "push", "--force"]
    environment:
      DATABASE_URL: *database-url
    restart: "no"
    networks: [db]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: saf
      POSTGRES_PASSWORD: saf
      POSTGRES_DB: saf
    volumes:
      - db:/var/lib/postgresql/data
    networks: [db]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "saf", "-d", "saf"]
      interval: 3s
      timeout: 3s
      retries: 20

  agent-image:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: saf-decisions-agent:0.83.0
    command: ["--version"]
    restart: "no"
    networks: [agent]

  tui-alice:
    <<: *tui
    environment:
      SAF_GATEWAY_URL: http://gateway:8082
      SAF_PASSWORD: ${ALICE_PASSWORD:?copy .env.example to .env}

  tui-bob:
    <<: *tui
    environment:
      SAF_GATEWAY_URL: http://gateway:8082
      SAF_PASSWORD: ${BOB_PASSWORD:?copy .env.example to .env}

networks:
  db:
    name: saf_decisions_db
  agent:
    name: saf_decisions_agent
  public:
    name: saf_decisions_public

volumes:
  db:
