name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # PostgreSQL is real in every test (ADR-0022); nothing about the Db is
    # mocked. Test files create and drop a database each on this server, so the
    # database named below is only ever connected to in order to manage those.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without this the first test can arrive before the server accepts
        # connections, which reads as a flaky Db rather than a race.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v7

      # Same toolchain as a developer gets: mise.toml is the only pin.
      - uses: jdx/mise-action@v4

      - run: npm ci

      # The one command. Whatever this runs is what the project is measured by.
      - run: npm run check

      # Separate because it packs, installs from the registry, and is slow. It needs
      # the network and no database at all: the framework applies no DDL any more, so
      # nothing in it connects (ADR-0046).
      - run: npm run check:package

      # Separate for the same reason: it installs `site/`'s own dependency tree, which
      # carries the TypeScript 6 that TypeDoc peers, and keeping that compiler out of the
      # inner loop is the whole reason `site/` is a package of its own (site/README.md). It
      # regenerates the reference, fails if a page has lost the links in its signature blocks,
      # and builds the site so a broken configuration fails here rather than in a browser.
      # It needs the network and no database.
      - run: npm run check:docs

      # The one end-to-end test: a real container running a real `pi` against the
      # real Agent server. Opt-in and therefore skipped by `npm run check`, which
      # is the inner loop — it builds an image over the network and takes about ten
      # seconds, and every other property of the adapter is a fast test. Run here so
      # that "skipped by default" does not become "never run at all".
      #
      # It needs this job's PostgreSQL and this runner's Docker. The container
      # reaches the Agent server through `host.docker.internal`, which under a plain
      # Linux daemon exists only because the test passes
      # `--add-host=host.docker.internal:host-gateway` and binds the server beyond
      # loopback.
      - run: npm run test:container

      # One step per example under `examples/`. Each is a real npm application: it installs
      # `shared-agent-framework` from the registry and type-checks against its own
      # `node_modules`, which is why `npm install` and not `npm ci` (no example commits a
      # lockfile until 1.0.0) and why nothing here points at this checkout.
      #
      # THIS DOES NOT CHECK AN EXAMPLE AGAINST THIS TREE. It checks it against the version it
      # pins, so a break introduced in `src` in the same commit is invisible here and stays
      # invisible until after a publish. What these four steps catch is editing rot, and a
      # version bumped to one the example does not work against. Nothing checks that an
      # example comes up at all.
      - run: npm install && npx tsc --noEmit
        working-directory: examples/00_minimal

      - run: npm install && npx tsc --noEmit
        working-directory: examples/01_scheduler

      - run: npm install && npx tsc --noEmit
        working-directory: examples/02_decisions

      - run: npm install && npx tsc --noEmit
        working-directory: examples/03_nostr
