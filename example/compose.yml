name: saf-example

services:
  gateway:
    build:
      context: ..
      dockerfile: example/gateway/Dockerfile
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set it in your shell; the agent's model needs it}
      DATABASE_URL: postgres://saf:saf@postgres:5432/saf
      HOST_DIR: ${PWD}
    volumes:
      # Root on the host. See docs/quickstart.md, "The Gateway holds your Docker socket".
      - /var/run/docker.sock:/var/run/docker.sock
      - ./state/workspace:/app/example/state/workspace
      - ./state/agent:/app/example/state/agent
    ports:
      - "127.0.0.1:8080:8080"
    networks: [db, agent]
    depends_on:
      postgres:
        condition: service_healthy
      agent-image:
        condition: service_completed_successfully
    stop_grace_period: 300s

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: saf
      POSTGRES_PASSWORD: saf
      POSTGRES_DB: saf
    volumes:
      - db:/var/lib/postgresql/data
    networks: [db]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "saf", "-d", "saf"]
      interval: 3s
      timeout: 3s
      retries: 20

  agent-image:
    build: ./agent
    image: saf-agent:0.83.0
    command: ["--version"]
    restart: "no"
    networks: [agent]

networks:
  db:
    name: saf_db
  agent:
    name: saf_agent

volumes:
  db:
