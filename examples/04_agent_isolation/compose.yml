name: concorde-example-04-agent-isolation

x-database-url: &database-url postgres://concorde:concorde@postgres:5432/concorde

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: *database-url
      USER_PASSWORD: ${USER_PASSWORD:?copy .env.example to .env}
      PUBLIC_HOST: 0.0.0.0
      PUBLIC_PORT: "8081"
      AGENT_SERVER_HOST: 0.0.0.0
      AGENT_SERVER_PORT: "7411"
      AGENT_INSTANCE_HOST: agent
      AGENT_INSTANCE_PORT: "4000"
      AGENT_SESSIONS_DIR: /sessions
    ports:
      - "127.0.0.1:8081:8081"
    networks: [db, agent, public]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      agent:
        condition: service_started
    stop_grace_period: 300s
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8081/openapi.json').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 20s

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    command:
      - socat
      - TCP-LISTEN:4000,reuseaddr,fork
      - EXEC:pi --mode rpc --no-approve
    environment:
      AGENT_SERVER_URL: http://gateway:7411
      PI_OFFLINE: "1"
      PI_CODING_AGENT_DIR: /home/agent/.pi/agent
      # An address, not a credential. It points pi's built-in provider at the proxy instead of
      # the provider, so `settings.json` is the other examples' own and needs no change.
      ANTHROPIC_BASE_URL: http://model-proxy:8080
      # The SDK will not start a request without one. The proxy replaces this header on the way
      # out, so this string is the whole of what the agent holds, and it is worth nothing.
      ANTHROPIC_API_KEY: not-a-real-key
    volumes:
      - ./state/workspace:/workspace
      - ./state/agent:/home/agent/.pi/agent
      - ./state/sessions:/sessions
      - ./AGENTS.md:/workspace/AGENTS.md:ro
      - ./settings.json:/home/agent/.pi/agent/settings.json:ro
    networks: [agent]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: 2g

  model-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "model-proxy.ts"]
    environment:
      MODEL_PROXY_PORT: "8080"
      MODEL_UPSTREAM_URL: ${MODEL_UPSTREAM_URL:-https://api.anthropic.com}
      MODEL_AUTH_HEADER: ${MODEL_AUTH_HEADER:-x-api-key}
      MODEL_AUTH_VALUE: ${MODEL_AUTH_VALUE:?copy .env.example to .env and put your model credential in it}
    networks: [agent, egress]
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "drizzle-kit", "push", "--force"]
    environment:
      DATABASE_URL: *database-url
    restart: "no"
    networks: [db]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: concorde
      POSTGRES_PASSWORD: concorde
      POSTGRES_DB: concorde
    volumes:
      - db:/var/lib/postgresql/data
    networks: [db]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "concorde", "-d", "concorde"]
      interval: 3s
      timeout: 3s
      retries: 20

  tui:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [cli]
    entrypoint: ["npx", "http-client-tui"]
    environment:
      CONCORDE_GATEWAY_URL: http://gateway:8081
      CONCORDE_PASSWORD: ${USER_PASSWORD:?copy .env.example to .env}
    networks: [public]

networks:
  db:
    name: concorde_agent_isolation_db
  # The agent's only network, and it reaches nothing outside this stack. The Gateway and the
  # proxy join it; the agent cannot leave it.
  agent:
    name: concorde_agent_isolation_agent
    internal: true
  egress:
    name: concorde_agent_isolation_egress
  public:
    name: concorde_agent_isolation_public

volumes:
  db:
