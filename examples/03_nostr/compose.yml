name: saf-example-03-nostr

x-database-url: &database-url postgres://saf:saf@postgres:5432/saf

x-relay-url: &relay-url ws://relay:7777

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?copy .env.example to .env and put your model key in it}
      DATABASE_URL: *database-url
      RELAY_URL: *relay-url
      NOSTR_AGENT_SECRET_KEY: ${NOSTR_AGENT_SECRET_KEY:?copy .env.example to .env}
      ALICE_PUBKEY: ${ALICE_PUBKEY:?copy .env.example to .env}
      BOB_PUBKEY: ${BOB_PUBKEY:?copy .env.example to .env}
      PUBLIC_HOST: 0.0.0.0
      PUBLIC_PORT: "8083"
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: "7411"
      AGENT_SERVER_URL: http://gateway:7411
      AGENT_IMAGE: saf-nostr-agent:0.83.0
      AGENT_NETWORK: saf_nostr_agent
      BASE_DIR_GATEWAY: /app
      BASE_DIR_HOST: ${PWD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./state/workspace:/app/state/workspace
      - ./state/agent:/app/state/agent
    ports:
      - "127.0.0.1:8083:8083"
    networks: [db, agent, nostr]
    depends_on:
      postgres:
        condition: service_healthy
      relay:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      agent-image:
        condition: service_completed_successfully
    stop_grace_period: 300s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "drizzle-kit", "push", "--force"]
    environment:
      DATABASE_URL: *database-url
    restart: "no"
    networks: [db]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: saf
      POSTGRES_PASSWORD: saf
      POSTGRES_DB: saf
    volumes:
      - db:/var/lib/postgresql/data
    networks: [db]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "saf", "-d", "saf"]
      interval: 3s
      timeout: 3s
      retries: 20

  relay:
    image: dockurr/strfry:1.1.1
    volumes:
      - relay:/app/strfry-db
      - ./strfry.conf:/etc/strfry.conf.default:ro
    ports:
      - "127.0.0.1:7777:7777"
    networks: [nostr]
    healthcheck:
      interval: 3s
      timeout: 3s
      retries: 20

  agent-image:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: saf-nostr-agent:0.83.0
    command: ["--version"]
    restart: "no"
    networks: [agent]

  nak-alice:
    build:
      context: .
      dockerfile: Dockerfile.nak
    image: saf-nostr-nak:latest
    profiles: [cli]
    environment:
      RELAY_URL: *relay-url
      AGENT_PUBKEY: ${NOSTR_AGENT_PUBKEY:?copy .env.example to .env}
      USER_SECRET: ${ALICE_SECRET_KEY:?copy .env.example to .env}
      USER_PUBKEY: ${ALICE_PUBKEY:?copy .env.example to .env}
    networks: [nostr]

  nak-bob:
    build:
      context: .
      dockerfile: Dockerfile.nak
    image: saf-nostr-nak:latest
    profiles: [cli]
    environment:
      RELAY_URL: *relay-url
      AGENT_PUBKEY: ${NOSTR_AGENT_PUBKEY:?copy .env.example to .env}
      USER_SECRET: ${BOB_SECRET_KEY:?copy .env.example to .env}
      USER_PUBKEY: ${BOB_PUBKEY:?copy .env.example to .env}
    networks: [nostr]

networks:
  db:
    name: saf_nostr_db
  agent:
    name: saf_nostr_agent
  nostr:
    name: saf_nostr_relay

volumes:
  db:
  relay:
