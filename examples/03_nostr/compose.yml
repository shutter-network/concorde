name: concorde-example-03-nostr

x-database-url: &database-url postgres://concorde:concorde@postgres:5432/concorde

x-relay-url: &relay-url ws://relay:7777

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: *database-url
      RELAY_URL: *relay-url
      NOSTR_AGENT_SECRET_KEY: ${NOSTR_AGENT_SECRET_KEY:?copy .env.example to .env}
      ALICE_PUBKEY: ${ALICE_PUBKEY:?copy .env.example to .env}
      BOB_PUBKEY: ${BOB_PUBKEY:?copy .env.example to .env}
      PUBLIC_HOST: 0.0.0.0
      PUBLIC_PORT: "8083"
      AGENT_SERVER_HOST: 0.0.0.0
      AGENT_SERVER_PORT: "7411"
      AGENT_INSTANCE_HOST: agent
      AGENT_INSTANCE_PORT: "4000"
      AGENT_SESSIONS_DIR: /sessions
    ports:
      - "127.0.0.1:8083:8083"
    networks: [db, agent, nostr]
    depends_on:
      postgres:
        condition: service_healthy
      relay:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      agent:
        condition: service_started
    stop_grace_period: 300s

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    command:
      - socat
      - TCP-LISTEN:4000,reuseaddr,fork
      - EXEC:pi --mode rpc --no-approve
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?copy .env.example to .env and put your model key in it}
      AGENT_SERVER_URL: http://gateway:7411
      PI_OFFLINE: "1"
      PI_CODING_AGENT_DIR: /home/agent/.pi/agent
    volumes:
      - ./state/workspace:/workspace
      - ./state/agent:/home/agent/.pi/agent
      - ./state/sessions:/sessions
      - ./AGENTS.md:/workspace/AGENTS.md:ro
      - ./settings.json:/home/agent/.pi/agent/settings.json:ro
    networks: [agent]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "drizzle-kit", "push", "--force"]
    environment:
      DATABASE_URL: *database-url
    restart: "no"
    networks: [db]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: concorde
      POSTGRES_PASSWORD: concorde
      POSTGRES_DB: concorde
    volumes:
      - db:/var/lib/postgresql/data
    networks: [db]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "concorde", "-d", "concorde"]
      interval: 3s
      timeout: 3s
      retries: 20

  relay:
    image: dockurr/strfry:1.1.1
    volumes:
      - relay:/app/strfry-db
      - ./strfry.conf:/etc/strfry.conf.default:ro
    ports:
      - "127.0.0.1:7777:7777"
    networks: [nostr]
    healthcheck:
      interval: 3s
      timeout: 3s
      retries: 20

  nak-alice:
    build:
      context: .
      dockerfile: Dockerfile.nak
    image: concorde-nostr-nak:latest
    profiles: [cli]
    environment:
      RELAY_URL: *relay-url
      AGENT_PUBKEY: ${NOSTR_AGENT_PUBKEY:?copy .env.example to .env}
      USER_SECRET: ${ALICE_SECRET_KEY:?copy .env.example to .env}
      USER_PUBKEY: ${ALICE_PUBKEY:?copy .env.example to .env}
    networks: [nostr]

  nak-bob:
    build:
      context: .
      dockerfile: Dockerfile.nak
    image: concorde-nostr-nak:latest
    profiles: [cli]
    environment:
      RELAY_URL: *relay-url
      AGENT_PUBKEY: ${NOSTR_AGENT_PUBKEY:?copy .env.example to .env}
      USER_SECRET: ${BOB_SECRET_KEY:?copy .env.example to .env}
      USER_PUBKEY: ${BOB_PUBKEY:?copy .env.example to .env}
    networks: [nostr]

networks:
  db:
    name: concorde_nostr_db
  agent:
    name: concorde_nostr_agent
  nostr:
    name: concorde_nostr_relay

volumes:
  db:
  relay:
