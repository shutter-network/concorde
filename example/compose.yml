name: saf-example

# One database, named once: the migrate service applies the schema to it and the Gateway
# queries it, and two copies of this string that drifted would be a Gateway reading a
# database nobody pushed to — which nothing checks and nothing would report (ADR-0046).
x-database-url: &database-url postgres://saf:saf@postgres:5432/saf

services:
  gateway:
    build:
      context: ..
      dockerfile: example/gateway/Dockerfile
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set it in your shell; the agent's model needs it}
      DATABASE_URL: *database-url
      # The shared tree, named on both sides: BASE_DIR_GATEWAY is where this container sees it
      # (the binds below mount into it), BASE_DIR_HOST is where it is on the host, and main.ts
      # feeds the pair to hostRoot so the daemon resolves the agent's mounts on the host.
      BASE_DIR_GATEWAY: /app/example
      BASE_DIR_HOST: ${PWD}
      # Where each server binds inside the container. The ports: below publish PUBLIC_PORT and
      # must agree with it; AGENT_PORT is bound but published to nobody.
      PUBLIC_HOST: 0.0.0.0
      PUBLIC_PORT: "8080"
      AGENT_HOST: 0.0.0.0
      AGENT_PORT: "7411"
      # The Shared Agent's signing identity, which main.ts loads itself (the framework parses no
      # PEM). WARNING: this points at insecure-example-only-signing-key.pem, a throwaway keypair
      # committed to example/ so the stack comes up from a clone with one command. It is public and
      # worthless and signs nothing anyone should verify; a real deployment generates its own key,
      # mounts it here instead, and never commits it. See docs/quickstart.md, "Generating a key".
      SIGNING_KEY_FILE: /app/example/insecure-example-only-signing-key.pem
    volumes:
      # Root on the host. See docs/quickstart.md, "The Gateway holds your Docker socket".
      - /var/run/docker.sock:/var/run/docker.sock
      - ./state/workspace:/app/example/state/workspace
      - ./state/agent:/app/example/state/agent
      # The committed decoy signing key, read-only. WARNING: worthless and public; a real
      # deployment mounts its own key here and generates it rather than reusing this one.
      - ./insecure-example-only-signing-key.pem:/app/example/insecure-example-only-signing-key.pem:ro
    ports:
      # Publishes PUBLIC_PORT to loopback; AGENT_PORT is bound but published to nobody.
      - "127.0.0.1:8080:8080"
    networks: [db, agent]
    depends_on:
      postgres:
        condition: service_healthy
      # Completed, not started: the Gateway's first query must not race the push. The
      # framework applies no migrations and verifies nothing at start (ADR-0046), so
      # this edge is the whole of what keeps it off an empty database.
      migrate:
        condition: service_completed_successfully
      agent-image:
        condition: service_completed_successfully
    stop_grace_period: 300s

  # This deployment owns its database, so this deployment applies its schema: the barrel
  # schema.ts, this stack's own drizzle-kit, one shot, and gone (ADR-0046). `push` because
  # this database is a volume you throw away; a production deployment runs `migrate`
  # against a folder it committed and changes nothing else here. It carries no
  # ANTHROPIC_API_KEY and joins no agent network, because a migration job that needs a
  # model credential is a broken migration job.
  migrate:
    build:
      context: ..
      dockerfile: example/migrate/Dockerfile
    environment:
      DATABASE_URL: *database-url
    restart: "no"
    networks: [db]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: saf
      POSTGRES_PASSWORD: saf
      POSTGRES_DB: saf
    volumes:
      - db:/var/lib/postgresql/data
    networks: [db]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "saf", "-d", "saf"]
      interval: 3s
      timeout: 3s
      retries: 20

  agent-image:
    build: ./agent
    image: saf-agent:0.83.0
    command: ["--version"]
    restart: "no"
    networks: [agent]

networks:
  db:
    name: saf_db
  agent:
    name: saf_agent

volumes:
  db:
