name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - run: npm ci

      - run: npm run check

      - run: npm run check:package

      - run: npm run check:docs

      - run: npm run test:container

      - run: npm install && npx tsc --noEmit
        working-directory: examples/00_minimal

      - run: npm install && npx tsc --noEmit
        working-directory: examples/01_scheduler

      - run: npm install && npx tsc --noEmit
        working-directory: examples/02_decisions

      - run: npm install && npx tsc --noEmit
        working-directory: examples/03_nostr
