name: concorde-example-06-openclaw

x-database-url: &database-url postgres://concorde:concorde@postgres:5432/concorde

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: *database-url
      USER_PASSWORD: ${USER_PASSWORD:?copy .env.example to .env}
      OPENCLAW_URL: ws://agent:18789
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?copy .env.example to .env}
      OPENCLAW_AGENT_ID: concorde
      OPENCLAW_ALLOW_INSECURE_PRIVATE_WS: "1"
      DEVICE_KEY_FILE: /app/insecure-example-only-device-key.pem
      PUBLIC_HOST: 0.0.0.0
      PUBLIC_PORT: "8086"
      AGENT_SERVER_HOST: 0.0.0.0
      AGENT_SERVER_PORT: "7411"
    volumes:
      - ./insecure-example-only-device-key.pem:/app/insecure-example-only-device-key.pem:ro
    ports:
      - "127.0.0.1:8086:8086"
    networks: [db, agent, public]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      agent:
        condition: service_healthy
    stop_grace_period: 300s

  agent:
    image: ghcr.io/openclaw/openclaw:2026.8.1
    command: ["node", "openclaw.mjs", "gateway"]
    environment:
      OPENCLAW_CONFIG_PATH: /home/node/.openclaw/openclaw.json
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?copy .env.example to .env}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?copy .env.example to .env and put your model key in it}
      HOME: /home/node
    volumes:
      - openclaw:/home/node/.openclaw
      - ./openclaw.json:/home/node/.openclaw/openclaw.json:ro
      - ./AGENTS.md:/home/node/.openclaw/workspace/AGENTS.md:ro
    networks: [agent]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18789/healthz"]
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "drizzle-kit", "push", "--force"]
    environment:
      DATABASE_URL: *database-url
    restart: "no"
    networks: [db]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: concorde
      POSTGRES_PASSWORD: concorde
      POSTGRES_DB: concorde
    volumes:
      - db:/var/lib/postgresql/data
    networks: [db]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "concorde", "-d", "concorde"]
      interval: 3s
      timeout: 3s
      retries: 20

  tui:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: [cli]
    entrypoint: ["npx", "concorde-chat-tui"]
    environment:
      CONCORDE_GATEWAY_URL: http://gateway:8086
      CONCORDE_PASSWORD: ${USER_PASSWORD:?copy .env.example to .env}
    networks: [public]

networks:
  db:
    name: concorde_openclaw_db
  agent:
    name: concorde_openclaw_agent
  public:
    name: concorde_openclaw_public

volumes:
  db:
  openclaw:
