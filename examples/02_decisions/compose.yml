name: concorde-example-02-decisions

x-database-url: &database-url postgres://concorde:concorde@postgres:5432/concorde

x-tui: &tui
  build:
    context: .
    dockerfile: Dockerfile
  profiles: [cli]
  entrypoint: ["npx", "http-client-tui"]
  networks: [public]

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: *database-url
      ALICE_PASSWORD: ${ALICE_PASSWORD:?copy .env.example to .env}
      BOB_PASSWORD: ${BOB_PASSWORD:?copy .env.example to .env}
      SIGNING_KEY_FILE: /app/insecure-example-only-signing-key.pem
      PUBLIC_HOST: 0.0.0.0
      PUBLIC_PORT: "8082"
      AGENT_SERVER_HOST: 0.0.0.0
      AGENT_SERVER_PORT: "7411"
      AGENT_INSTANCE_HOST: agent
      AGENT_INSTANCE_PORT: "4000"
      AGENT_SESSIONS_DIR: /sessions
    volumes:
      - ./insecure-example-only-signing-key.pem:/app/insecure-example-only-signing-key.pem:ro
    ports:
      - "127.0.0.1:8082:8082"
    networks: [db, agent, public]
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      agent:
        condition: service_started
    stop_grace_period: 300s

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    command:
      - socat
      - TCP-LISTEN:4000,reuseaddr,fork
      - EXEC:pi --mode rpc --no-approve
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?copy .env.example to .env and put your model key in it}
      AGENT_SERVER_URL: http://gateway:7411
      PI_OFFLINE: "1"
      PI_CODING_AGENT_DIR: /home/agent/.pi/agent
    volumes:
      - ./state/workspace:/workspace
      - ./state/agent:/home/agent/.pi/agent
      - ./state/sessions:/sessions
      - ./AGENTS.md:/workspace/AGENTS.md:ro
      - ./settings.json:/home/agent/.pi/agent/settings.json:ro
    networks: [agent]

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["npx", "drizzle-kit", "push", "--force"]
    environment:
      DATABASE_URL: *database-url
    restart: "no"
    networks: [db]
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: concorde
      POSTGRES_PASSWORD: concorde
      POSTGRES_DB: concorde
    volumes:
      - db:/var/lib/postgresql/data
    networks: [db]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "concorde", "-d", "concorde"]
      interval: 3s
      timeout: 3s
      retries: 20

  tui-alice:
    <<: *tui
    environment:
      CONCORDE_GATEWAY_URL: http://gateway:8082
      CONCORDE_PASSWORD: ${ALICE_PASSWORD:?copy .env.example to .env}

  tui-bob:
    <<: *tui
    environment:
      CONCORDE_GATEWAY_URL: http://gateway:8082
      CONCORDE_PASSWORD: ${BOB_PASSWORD:?copy .env.example to .env}

networks:
  db:
    name: concorde_decisions_db
  agent:
    name: concorde_decisions_agent
  public:
    name: concorde_decisions_public

volumes:
  db:
